name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm agents:test
      - run: pnpm build

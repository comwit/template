name: Deploy to Comwit Cloud

on:
  workflow_dispatch:

env:
  # Pin the currently published CLI. Repin only after a newer release is
  # published and its deploy contract passes integration validation.
  COMWIT_CLI_VERSION: "0.1.7"
  COMWIT_PROJECT: ${{ vars.COMWIT_PROJECT }}
  COMWIT_APP: ${{ vars.COMWIT_APP }}
  # Optional resource Variables. Empty is valid when the project did not select
  # that resource; private/provisioning Storage may also have no public URL.
  COMWIT_DATABASE_ID: ${{ vars.COMWIT_DATABASE_ID }}
  DATABASE_URL: ${{ vars.DATABASE_URL }}
  COMWIT_STORAGE_ID: ${{ vars.COMWIT_STORAGE_ID }}
  COMWIT_STORAGE_ENDPOINT: ${{ vars.COMWIT_STORAGE_ENDPOINT }}
  COMWIT_STORAGE_BUCKET: ${{ vars.COMWIT_STORAGE_BUCKET }}
  COMWIT_STORAGE_PUBLIC_BASE_URL: ${{ vars.COMWIT_STORAGE_PUBLIC_BASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CG environment contract
        env:
          COMWIT_CLOUD_TOKEN: ${{ secrets.COMWIT_CLOUD_TOKEN }}
          COMWIT_DEPLOY_TOKEN: ${{ secrets.COMWIT_DEPLOY_TOKEN }}
        run: |
          node <<'NODE'
          const required = [
            "COMWIT_PROJECT",
            "COMWIT_APP",
            "COMWIT_CLOUD_TOKEN",
            "COMWIT_DEPLOY_TOKEN",
          ]
          const missing = required.filter((key) => !process.env[key]?.trim())
          if (missing.length) {
            throw new Error(`CG did not inject required keys: ${missing.join(", ")}`)
          }
          if (process.env.COMWIT_CLOUD_TOKEN === process.env.COMWIT_DEPLOY_TOKEN) {
            throw new Error("runtime and deploy credentials must be distinct")
          }
          const databaseKeys = ["COMWIT_DATABASE_ID", "DATABASE_URL"]
          const configuredDatabaseKeys = databaseKeys.filter((key) =>
            process.env[key]?.trim(),
          )
          if (configuredDatabaseKeys.length !== 0 && configuredDatabaseKeys.length !== 2) {
            throw new Error("Database Variables must configure ID and URL together")
          }
          const databaseUrl = process.env.DATABASE_URL?.trim()
          if (configuredDatabaseKeys.length === 2) {
            let parsedDatabaseUrl
            try {
              parsedDatabaseUrl = new URL(databaseUrl)
            } catch {
              throw new Error("DATABASE_URL is not a valid URL")
            }
            if (
              !["https:", "libsql:"].includes(parsedDatabaseUrl.protocol) ||
              !parsedDatabaseUrl.hostname ||
              parsedDatabaseUrl.username ||
              parsedDatabaseUrl.password ||
              parsedDatabaseUrl.search ||
              parsedDatabaseUrl.hash
            ) {
              throw new Error("DATABASE_URL must use https: or libsql: without credentials, query, or fragment")
            }
          }
          const storageCoreKeys = [
            "COMWIT_STORAGE_ID",
            "COMWIT_STORAGE_ENDPOINT",
            "COMWIT_STORAGE_BUCKET",
          ]
          const configuredStorageKeys = storageCoreKeys.filter((key) =>
            process.env[key]?.trim(),
          )
          if (configuredStorageKeys.length !== 0 && configuredStorageKeys.length !== 3) {
            throw new Error("Storage Variables must configure ID, endpoint, and bucket together")
          }
          if (configuredStorageKeys.length === 3) {
            let storageEndpoint
            try {
              storageEndpoint = new URL(process.env.COMWIT_STORAGE_ENDPOINT)
            } catch {
              throw new Error("COMWIT_STORAGE_ENDPOINT must be a valid URL")
            }
            if (
              storageEndpoint.protocol !== "https:" ||
              !storageEndpoint.hostname ||
              storageEndpoint.username ||
              storageEndpoint.password ||
              storageEndpoint.search ||
              storageEndpoint.hash
            ) {
              throw new Error("COMWIT_STORAGE_ENDPOINT must be a secure HTTPS endpoint")
            }
          }
          if (
            process.env.COMWIT_STORAGE_PUBLIC_BASE_URL?.trim() &&
            configuredStorageKeys.length !== 3
          ) {
            throw new Error("Storage public URL requires the Storage core Variables")
          }
          console.log("CG core environment is present and optional resource Variables are coherent; secret values were not printed.")
          NODE

      - name: Validate
        run: pnpm run validate

      - name: Build brrrd package
        env:
          # Some generated apps query libSQL while prerendering. This is the
          # runtime credential, never the deploy credential.
          COMWIT_CLOUD_TOKEN: ${{ secrets.COMWIT_CLOUD_TOKEN }}
        run: pnpm run build

      - name: Verify brrrd output
        env:
          COMWIT_CLOUD_TOKEN: ${{ secrets.COMWIT_CLOUD_TOKEN }}
        run: |
          test -f dist/brrrd/manifest.json
          node <<'NODE'
          const { readdirSync, readFileSync, statSync } = require("node:fs")
          const { join } = require("node:path")
          const secret = Buffer.from(process.env.COMWIT_CLOUD_TOKEN)
          const walk = (dir) => readdirSync(dir).flatMap((name) => {
            const path = join(dir, name)
            return statSync(path).isDirectory() ? walk(path) : [path]
          })
          const leaked = walk("dist/brrrd").find((path) =>
            readFileSync(path).includes(secret),
          )
          if (leaked) throw new Error(`runtime token was bundled into ${leaked}`)
          console.log("brrrd output exists and does not contain the runtime token.")
          NODE

      # CG owns app environment/secret upsert before dispatch. The deploy CLI
      # publishes the artifact to that App; it must not rewrite runtime secrets
      # as ordinary workflow output or non-secret environment entries.
      - name: Deploy
        env:
          COMWIT_DEPLOY_TOKEN: ${{ secrets.COMWIT_DEPLOY_TOKEN }}
        run: |
          set -eu
          pnpm dlx "comwit-cli@${COMWIT_CLI_VERSION}" login --token "$COMWIT_DEPLOY_TOKEN"
          pnpm dlx "comwit-cli@${COMWIT_CLI_VERSION}" deploy \
            --project "$COMWIT_PROJECT" \
            --app "$COMWIT_APP" \
            --package ./dist/brrrd
